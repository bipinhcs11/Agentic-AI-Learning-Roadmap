x-common-environment: &common-environment
  MCP_ENV: local
  MCP_SERVICE_HOST: 0.0.0.0
  MCP_TOKEN_URL: http://mock-enterprise:9000/oauth2/token
  MCP_API_GATEWAY_BASE_URL: http://mock-enterprise:9000

services:
  mock-enterprise:
    build: .
    command: enterprise-mcp-mock-api
    environment:
      <<: *common-environment
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 3s
      timeout: 2s
      retries: 10

  work-item-analysis:
    build: .
    command: mcp-work-item-analysis
    environment:
      <<: *common-environment
      MCP_WORK_ITEM_CLIENT_ID: work-item-local
      MCP_WORK_ITEM_CLIENT_SECRET: fictional-work-item-secret
      MCP_WORK_ITEM_ASSERTION_SECRET: fictional-work-item-assertion-key-at-least-32-bytes
    depends_on:
      mock-enterprise:
        condition: service_healthy

  config-check:
    build: .
    command: mcp-config-check
    environment:
      <<: *common-environment
      MCP_CONFIG_CHECK_CLIENT_ID: config-check-local
      MCP_CONFIG_CHECK_CLIENT_SECRET: fictional-config-check-secret
      MCP_CONFIG_CHECK_ASSERTION_SECRET: fictional-config-check-assertion-key-at-least-32-bytes
    depends_on:
      mock-enterprise:
        condition: service_healthy

  mcp-gateway:
    build: .
    command: enterprise-mcp-gateway
    environment:
      <<: *common-environment
      MCP_GATEWAY_HOST: 0.0.0.0
      MCP_GATEWAY_JWT_SECRET: fictional-local-gateway-signing-key-at-least-32-bytes
      MCP_WORK_ITEM_ASSERTION_SECRET: fictional-work-item-assertion-key-at-least-32-bytes
      MCP_CONFIG_CHECK_ASSERTION_SECRET: fictional-config-check-assertion-key-at-least-32-bytes
      MCP_WORK_ITEM_SERVER_URL: http://work-item-analysis:8101/mcp
      MCP_CONFIG_CHECK_SERVER_URL: http://config-check:8102/mcp
    depends_on:
      - work-item-analysis
      - config-check
    ports:
      - "127.0.0.1:8080:8080"
