<text x="70" y="1247" class="body">Today: no automatic model call. The user runs Copilot manually; offline mode assembles supplied text.</text>
<text x="70" y="1273" class="body">Future: evaluate approved Copilot SDK automation, transcript understanding, and hybrid retrieval.</text>
<text x="70" y="1299" class="body">A meeting statement is not policy approval. A reported DONE item is not independently verified delivery.</text>
