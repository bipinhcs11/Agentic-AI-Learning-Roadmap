<title id="title">Business document assistant: current POC and enterprise direction</title>
<desc id="desc">Zoom transcripts or manual notes enter a shared application service through the web API or an optional future MCP facade. Meeting understanding, history, permission-aware retrieval, drafting and review produce Word, Confluence, Jira and future PowerPoint outputs. Green labels identify current POC capabilities; amber labels identify planned capabilities. All live connectors are future work.</desc>
